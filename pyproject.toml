[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "JoJo"
version = "0.2.0"
description = "Transit light curves for oblate, asymmetric and ringed planets"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
test = ["pytest>=7", "scipy>=1.9"]
dev = ["pytest>=7", "scipy>=1.9", "build>=1", "ruff>=0.9"]
web = ["matplotlib>=3.6", "plotly>=5", "streamlit>=1.30"]

[tool.setuptools.packages.find]
include = ["JoJo", "JoJo.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["supplement", "webapp", "JoJo/core/_occultquad.py", "JoJo/core/_solve_quartic.py"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
