name: Tests
on: [push, pull_request]
jobs:
  numerical-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest -q
      - run: ruff check JoJo tests examples
      - run: python -m build
      - name: Smoke-test installed wheel outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python -c "from JoJo import oblate_lc, egg_lc, ring_lc; print(oblate_lc.__module__, egg_lc.__module__, ring_lc.__module__)"
